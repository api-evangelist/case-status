aid: case-status
name: Case Status
description: >-
  Case Status is a Charleston, South Carolina legal technology company, founded in 2018 by Andy
  Seavers and Lauren Gulley, that builds an AI-powered client engagement, experience, and
  communication platform for modern law firms. It delivers a branded, mobile-first client portal
  (iOS and Android), a CMS-integrated secure messaging hub with 1:1, bulk, and automated options,
  AI-driven Client Intelligence (message urgency triage, response recommendations, case
  summarization, sentiment prediction, and translation across 140+ languages), and client
  satisfaction analytics such as NPS, Predictive NPS, and CSAT. Case Status integrates with leading
  case management systems including Clio, Litify, MyCase, Neos, Filevine, SmartAdvocate, Docketwise,
  PracticePanther, SmokeBall, CASEpeer, MerusCase, CoCounselor, Salesforce, NuLaw, Matterly, and
  Zapier, plus a Chrome extension for attorneys. It was surfaced as a portfolio company of Techstars.
